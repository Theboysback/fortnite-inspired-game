<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Battle Royale</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#hud {
  position: fixed;
  top: 20px;
  left: 20px;
  color: white;
  font-size: 18px;
  text-shadow: 2px 2px 4px #000;
  z-index: 10;
  line-height: 1.8;
}
#help {
  position: fixed;
  bottom: 20px;
  left: 20px;
  color: white;
  font-size: 14px;
  opacity: 0.8;
  text-shadow: 2px 2px 4px #000;
  z-index: 10;
}
#over {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  place-items: center;
  text-align: center;
  z-index: 100;
  color: white;
}
#over h1 {
  font-size: 48px;
  margin: 0 0 20px 0;
}
#over p {
  font-size: 24px;
  margin: 10px 0;
}
button {
  font-size: 18px;
  padding: 12px 24px;
  margin-top: 20px;
  cursor: pointer;
  background: #0099ff;
  color: white;
  border: none;
  border-radius: 4px;
}
button:hover {
  background: #0077cc;
}
</style>
</head>
<body>
<div id="hud">
❤️ Health: <b id="hp">100</b>/100<br>
🔫 Ammo: <b id="ammo">30</b>/30<br>
💀 Kills: <b id="kills">0</b>
</div>
<div id="help">
WASD move · Space jump · Mouse look · Click shoot · Q build wall · ESC unlock
</div>
<div id="over">
<div>
<h1>Game Over!</h1>
<p id="stats"></p>
<button onclick="location.reload()">Play Again</button>
</div>
</div>
<script src="game.js"></script>
</body>
</html>
