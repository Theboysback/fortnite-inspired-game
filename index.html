<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Battle Royale</title>
<style>
html,body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #18243a;
  color: white;
  font: 16px Arial;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#hud {
  position: fixed;
  top: 16px;
  left: 16px;
  text-shadow: 1px 1px #000;
  line-height: 1.6;
  z-index: 10;
}
#help {
  position: fixed;
  bottom: 14px;
  left: 16px;
  opacity: 0.8;
  z-index: 10;
}
#over {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  place-items: center;
  text-align: center;
  font-size: 28px;
  z-index: 100;
}
button {
  font-size: 18px;
  padding: 10px 18px;
  cursor: pointer;
  background: #2385e8;
  color: white;
  border: none;
  border-radius: 4px;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
❤️ Health: <b id="hp">100</b><br>
🔫 Ammo: <b id="ammo">30</b><br>
💀 Kills: <b id="kills">0</b>
</div>
<div id="help">
WASD move · Mouse aim · Click shoot · Q build wall
</div>
<div id="over">
<div>
<h1>Game Over</h1>
<p id="stats"></p>
<button onclick="location.reload()">Play again</button>
</div>
</div>
<script src="game.js"></script>
</body>
</html>
